*{margin:0;padding:0}
:root{

  --accent:#ff5722;--accent-2:#e64a19;--accent-soft:#ffe8dd;
  --radius:20px;--radius-sm:12px;

html{scroll-behavior:smooth}
body{

  overflow-x:hidden;
}
.serif{font-family:'Fraunces',ui-serif,Georgia,serif;font-optical-sizing:auto}
.brand-top{max-width:var(--container);margin:0 auto;padding:26px 20px 0}
.brand-inner{

.hero{padding:30px 20px 22px;max-width:var(--container);margin:0 auto}
.hero-eyebrow{

.hero-eyebrow::before{content:'';width:20px;height:1px;background:var(--accent)}
.hero-title{

}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-teacher{display:flex;align-items:center;gap:12px;margin-top:16px}
.hero-avatar{

.hero-meta{font-size:13px;line-height:1.35}
.hero-meta strong{display:block;font-weight:600;color:var(--ink);font-size:14px}
.hero-meta span{color:var(--ink-3);font-size:12px;letter-spacing:.02em}
.search-shell{padding:10px 20px 0;max-width:var(--container);margin:0 auto}
.search{
  display:flex;align-items:center;gap:12px;padding:4px 4px 4px 20px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-card);transition:all .2s ease;
}
.search:focus-within{border-color:var(--ink-3);box-shadow:0 2px 4px rgba(26,22,19,.05),0 16px 32px -12px rgba(26,22,19,.14)}
.search i{color:var(--ink-3);font-size:13px}
.search input{
  flex:1;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:14px;font-weight:500;color:var(--ink);padding:13px 0;min-width:0;

.search input::placeholder{color:var(--ink-3);font-weight:400}
.section-label{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 14px;gap:12px}
.section-label h2{

}
.section-label .count{

}
.content{padding:0 20px 100px;max-width:var(--container);margin:0 auto}
.chapter-card{

}
.chapter-card:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(26,22,19,.05),0 16px 32px -12px rgba(26,22,19,.14);
  border-color:var(--line-2);
}
.chapter-card:active{transform:translateY(0)}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.chapter-num{

  color:var(--accent);letter-spacing:-.04em;

}
.chapter-body{flex:1;min-width:0}
.chapter-title{
  font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink);
  line-height:1.3;text-transform:uppercase;overflow-wrap:anywhere;
  margin-bottom:3px;
}
.chapter-meta{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.chapter-arrow{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;
  background:var(--paper);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all .2s ease;
}
.chapter-card:hover .chapter-arrow{

}
.back-btn{

  background:var(--card);border:1px solid var(--line);border-radius:999px;

  cursor:pointer;transition:all .15s ease;margin-bottom:18px;

.back-btn:hover{background:var(--paper-2);color:var(--ink)}
.back-btn i{font-size:10px}
.res-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);

}
.res-head{

.res-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* ================= HELPERS ================= */
function pad2(n){ return String(n).padStart(2,'0'); }

/* ================= STATE ================= */
const contentEl = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
let activeChapter = null;

/* ================= VIEW: CHAPTER LIST ================= */
function renderChapterList(){
  contentEl.innerHTML='';
  const label=document.createElement('div');
  label.className='section-label';
  label.innerHTML=`<h2>Topics</h2><span class="count">${RAW_DATA.length} total</span>`;
  contentEl.appendChild(label);

  RAW_DATA.forEach((subj,i)=>{
    const card=document.createElement('div');
    card.className='chapter-card';
    card.style.animationDelay=(i*25)+'ms';
    card.innerHTML=`
      <div class="chapter-num">${pad2(i+1)}</div>
      <div class="chapter-body">
        <div class="chapter-title">${subj.name}</div>
        <div class="chapter-meta">Topic · ${subj.items.length} item${subj.items.length===1?'':'s'}</div>
      </div>
      <div class="chapter-arrow"><i class="fas fa-arrow-right"></i></div>
    `;
    card.addEventListener('click',()=>openChapter(i));
    contentEl.appendChild(card);
  });
}

/* ================= VIEW: CHAPTER DETAIL ================= */
function openChapter(idx){
  activeChapter=idx;
  searchInput.value='';
  renderChapterDetail();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderChapterDetail(){
  contentEl.innerHTML='';
  const ch=RAW_DATA[activeChapter];
  if(!ch){ activeChapter=null; renderChapterList(); return; }

  const back=document.createElement('button');
  back.className='back-btn';
  back.innerHTML='<i class="fas fa-arrow-left"></i> Back to topics';
  back.addEventListener('click',()=>{
    activeChapter=null;
    renderChapterList();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  contentEl.appendChild(back);

  const label=document.createElement('div');
  label.className='section-label';
  label.innerHTML=`<h2>${ch.name}</h2><span class="count">${ch.items.length} item${ch.items.length===1?'':'s'}</span>`;
  contentEl.appendChild(label);

  ch.items.forEach((it,i)=>{
    const card=document.createElement('div');
    card.className='res-card';
    card.style.animationDelay=(i*20)+'ms';

    const btns=[];
    if(it.v) btns.push(`<a class="res-btn video" href="${it.v}" target="_blank" rel="noopener"><i class="fas fa-play"></i> Video</a>`);
    if(it.p) btns.push(`<a class="res-btn pdf" href="${it.p}" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> PDF</a>`);

    const gridClass = btns.length===1 ? 'res-actions single' : 'res-actions';

    card.innerHTML=`
      <div class="res-head">
        <div class="res-num">${pad2(i+1)}</div>
        <div class="res-title">${it.t}</div>
      </div>
      <div class="${gridClass}">${btns.join('')}</div>
    `;
    contentEl.appendChild(card);
  });
}

/* ================= VIEW: SEARCH RESULTS ================= */
function renderSearchResults(q){
  contentEl.innerHTML='';
  const query=q.toLowerCase();
  const matches=[];
  RAW_DATA.forEach((subj)=>{
    subj.items.forEach((it,ii)=>{
      if(it.t.toLowerCase().includes(query) || subj.name.toLowerCase().includes(query)){
        matches.push({ subject:subj.name, itemIdx:ii, item:it });
      }
    });
  });

  if(matches.length===0){
    contentEl.innerHTML=`
      <div class="empty">
        <div class="empty-icon"><i class="fas fa-search"></i></div>
        <div class="empty-title">No matches</div>
        <div class="empty-sub">Try a different search term</div>
      </div>`;
    return;
  }

  const label=document.createElement('div');
  label.className='section-label';
  label.innerHTML=`<h2>Results</h2><span class="count">${matches.length} found</span>`;
  contentEl.appendChild(label);

  matches.slice(0,200).forEach((m)=>{
    const it=m.item;
    const btns=[];
    if(it.v) btns.push(`<a class="res-btn video" href="${it.v}" target="_blank" rel="noopener"><i class="fas fa-play"></i> Video</a>`);
    if(it.p) btns.push(`<a class="res-btn pdf" href="${it.p}" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> PDF</a>`);

    const gridClass = btns.length===1 ? 'res-actions single' : 'res-actions';

    const card=document.createElement('div');
    card.className='res-card';
    card.innerHTML=`
      <div class="res-head">
        <div class="res-num">${pad2(m.itemIdx+1)}</div>
        <div class="res-title"><strong style="color:var(--accent-2);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px;">${m.subject}</strong>${it.t}</div>
      </div>
      <div class="${gridClass}">${btns.join('')}</div>
    `;
    contentEl.appendChild(card);
  });
}

/* ================= SEARCH ================= */
searchInput.addEventListener('input',e=>{
  const q=e.target.value.trim();
  if(!q){
    if(activeChapter!==null) renderChapterDetail();
    else renderChapterList();
  } else {
    renderSearchResults(q);
  }
});

/* ================= INIT ================= */
renderChapterList();

})();
</script>
