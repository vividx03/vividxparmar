<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deployment Paused</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
    }

    .message div {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.7;
    }

    .deployment-id {
      position: absolute;
      left: 50%;
      bottom: 7.5%;
      transform: translateX(-50%);

      color: #777;
      font-family: monospace;
      font-size: 11px;
      font-weight: 400;

      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="message">
      <div>This deployment is</div>
      <div>temporarily paused</div>
    </div>

    <div class="deployment-id" id="deploymentId"></div>

  </div>

  <script>
    function randomHex(length) {
      const chars = "0123456789abcdef";
      let result = "";

      for (let i = 0; i < length; i++) {
        result += chars[Math.floor(Math.random() * chars.length)];
      }

      return result;
    }

    function randomString(length) {
      const chars =
        "abcdefghijklmnopqrstuvwxyz0123456789";

      let result = "";

      for (let i = 0; i < length; i++) {
        result += chars[Math.floor(Math.random() * chars.length)];
      }

      return result;
    }

    function generateDeploymentId() {
      return `bom1::${randomString(5)}-${Date.now()}-${randomHex(10)}`;
    }

    document.getElementById("deploymentId").textContent =
      generateDeploymentId();
  </script>

</body>
</html>
